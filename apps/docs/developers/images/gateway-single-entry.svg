<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#1e293b">
  <defs>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="239" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 경유 경로 라벨 -->
  <text x="380" y="26" text-anchor="middle" font-size="12" fill="#15803d" font-weight="600">✓  게이트웨이 경유 — 인증·인가 통과</text>

  <!-- 게이트웨이 -->
  <rect x="290" y="44" width="180" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="72" text-anchor="middle" font-weight="700" font-size="14" fill="#1e3a8a">API Gateway</text>
  <text x="380" y="92" text-anchor="middle" font-size="12" fill="#475569">인증 · 인가</text>

  <!-- 클라이언트 -->
  <rect x="40" y="118" width="130" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="105" y="148" text-anchor="middle" font-weight="600" font-size="13">클라이언트</text>
  <text x="105" y="167" text-anchor="middle" font-size="11" fill="#64748b">브라우저 / 앱</text>

  <!-- 본인 서비스 -->
  <rect x="560" y="118" width="130" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="625" y="148" text-anchor="middle" font-weight="600" font-size="13">본인 서비스</text>
  <text x="625" y="167" text-anchor="middle" font-size="11" fill="#64748b" font-family="'SFMono-Regular',Consolas,Menlo,monospace">upstream</text>

  <!-- 경유 경로(초록) -->
  <line x1="154" y1="122" x2="300" y2="107" stroke="#22c55e" stroke-width="1.8" marker-end="url(#ahg)"/>
  <line x1="460" y1="107" x2="566" y2="121" stroke="#22c55e" stroke-width="1.8" marker-end="url(#ahg)"/>

  <!-- 직접 호출(차단) 경로 -->
  <line x1="170" y1="150" x2="560" y2="150" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5"/>
  <circle cx="365" cy="150" r="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <path d="M359,144 L371,156 M371,144 L359,156" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
  <text x="365" y="214" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">✗  직접 호출(게이트웨이 우회)은 차단</text>
</svg>
