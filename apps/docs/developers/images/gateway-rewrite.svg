<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#1e293b">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="393" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 요청 -->
  <rect x="40" y="28" width="640" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="50" font-size="12" font-weight="600" fill="#64748b">클라이언트 요청</text>
  <text x="56" y="76" font-size="13" font-family="'SFMono-Regular',Consolas,Menlo,monospace">GET api.econovation.kr<tspan fill="#2563eb" font-weight="700">/eeos</tspan><tspan fill="#16a34a">/guest/programs?category=all</tspan></text>

  <line x1="360" y1="90" x2="360" y2="104" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 게이트웨이가 하는 일: ①②③ 묶음 -->
  <rect x="88" y="104" width="544" height="182" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="100" y="92" width="150" height="21" rx="10" fill="#2563eb"/>
  <text x="175" y="107" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">게이트웨이가 하는 일</text>

  <!-- 단계 1 매칭 -->
  <rect x="180" y="114" width="360" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="138" text-anchor="middle" font-size="13">①  pathPrefix 매칭  →  /eeos</text>

  <line x1="360" y1="152" x2="360" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 단계 2 strip -->
  <rect x="110" y="176" width="500" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="200" text-anchor="middle" font-size="13">②  Prefix Strip  →  /guest/programs?category=all</text>

  <line x1="360" y1="214" x2="360" y2="237" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 단계 3 결합 -->
  <rect x="140" y="238" width="440" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="262" text-anchor="middle" font-size="13">③  upstreamUrl 에 남은 경로 붙이기</text>

  <line x1="360" y1="286" x2="360" y2="299" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- upstream 호출 -->
  <rect x="40" y="300" width="640" height="62" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="56" y="322" font-size="12" font-weight="600" fill="#15803d">Upstream 호출</text>
  <text x="56" y="348" font-size="13" font-family="'SFMono-Regular',Consolas,Menlo,monospace">GET https://be.eeos.econovation.kr/api<tspan fill="#16a34a">/guest/programs?category=all</tspan></text>
</svg>
