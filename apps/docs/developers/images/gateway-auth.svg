<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#1e293b">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="445" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 요청 -->
  <rect x="130" y="24" width="340" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="300" y="48" text-anchor="middle" font-weight="600" font-size="13">클라이언트 요청</text>
  <text x="300" y="68" text-anchor="middle" font-size="11" fill="#64748b">Authorization 헤더 또는 쿠키의 토큰</text>

  <line x1="300" y1="82" x2="300" y2="109" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 인증 판단 -->
  <rect x="150" y="110" width="300" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="300" y="143" text-anchor="middle" font-size="13">① 인증 — 유효한 SSO 토큰인가?</text>
  <line x1="450" y1="138" x2="558" y2="138" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="504" y="130" text-anchor="middle" font-size="11" fill="#64748b">아니오</text>
  <rect x="560" y="112" width="140" height="52" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="630" y="136" text-anchor="middle" font-weight="700" font-size="16" fill="#dc2626">401</text>
  <text x="630" y="154" text-anchor="middle" font-size="11" fill="#b91c1c">Unauthorized</text>

  <line x1="300" y1="166" x2="300" y2="195" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="312" y="185" font-size="11" fill="#64748b">예</text>

  <!-- 인가 판단 -->
  <rect x="150" y="196" width="300" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="300" y="220" text-anchor="middle" font-size="13">② 인가 — 권한이 있는가?</text>
  <text x="300" y="239" text-anchor="middle" font-size="10" fill="#b45309">(TBD — 세부 모델 설계 중)</text>
  <line x1="450" y1="224" x2="558" y2="224" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="504" y="216" text-anchor="middle" font-size="11" fill="#64748b">아니오</text>
  <rect x="560" y="198" width="140" height="52" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="630" y="222" text-anchor="middle" font-weight="700" font-size="16" fill="#dc2626">403</text>
  <text x="630" y="240" text-anchor="middle" font-size="11" fill="#b91c1c">Forbidden</text>

  <line x1="300" y1="252" x2="300" y2="281" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="312" y="271" font-size="11" fill="#64748b">예</text>

  <!-- 헤더 주입 -->
  <rect x="130" y="282" width="340" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="300" y="306" text-anchor="middle" font-weight="600" font-size="13">③ 신원 정보를 헤더에 주입</text>
  <text x="300" y="325" text-anchor="middle" font-size="11" fill="#64748b" font-family="'SFMono-Regular',Consolas,Menlo,monospace">예: X-User-Passport</text>

  <line x1="300" y1="340" x2="300" y2="367" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- upstream -->
  <rect x="150" y="368" width="300" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="300" y="399" text-anchor="middle" font-weight="600" font-size="13" fill="#15803d">Upstream 서버로 전달</text>
</svg>
