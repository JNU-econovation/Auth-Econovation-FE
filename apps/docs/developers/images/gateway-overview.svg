<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#1e293b">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="379" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 클라이언트 -->
  <rect x="40" y="150" width="150" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="115" y="182" text-anchor="middle" font-weight="600" font-size="15">클라이언트</text>
  <text x="115" y="202" text-anchor="middle" font-size="12" fill="#64748b">브라우저 / 앱</text>

  <!-- 클라이언트 -> 게이트웨이 -->
  <line x1="190" y1="185" x2="298" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="244" y="176" text-anchor="middle" font-size="11" fill="#64748b">모든 요청</text>

  <!-- 게이트웨이 -->
  <rect x="300" y="128" width="200" height="114" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="158" text-anchor="middle" font-weight="700" font-size="16" fill="#1e3a8a">API Gateway</text>
  <text x="400" y="180" text-anchor="middle" font-size="12" fill="#475569" font-family="'SFMono-Regular',Consolas,Menlo,monospace">api.econovation.kr</text>
  <line x1="324" y1="194" x2="476" y2="194" stroke="#bfdbfe"/>
  <text x="400" y="220" text-anchor="middle" font-size="13">인증 · 인가 검사</text>

  <!-- 분기 -->
  <line x1="400" y1="242" x2="400" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="258" font-size="11" fill="#64748b">pathPrefix로 분기</text>
  <line x1="140" y1="264" x2="620" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="140" y1="264" x2="140" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="380" y1="264" x2="380" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="620" y1="264" x2="620" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="148" y="284" font-size="11" fill="#2563eb" font-family="'SFMono-Regular',Consolas,Menlo,monospace">/eeos/*</text>
  <text x="388" y="284" font-size="11" fill="#2563eb" font-family="'SFMono-Regular',Consolas,Menlo,monospace">/eeap/*</text>
  <text x="628" y="284" font-size="11" fill="#2563eb" font-family="'SFMono-Regular',Consolas,Menlo,monospace">/other/*</text>

  <!-- 서비스들 -->
  <rect x="70" y="300" width="140" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="326" text-anchor="middle" font-weight="600" font-size="13">eeos 서버</text>
  <text x="140" y="346" text-anchor="middle" font-size="10" fill="#64748b" font-family="'SFMono-Regular',Consolas,Menlo,monospace">your-backend.example.com</text>

  <rect x="310" y="300" width="140" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="326" text-anchor="middle" font-weight="600" font-size="13">eeap 서버</text>
  <text x="380" y="346" text-anchor="middle" font-size="12" fill="#94a3b8">…</text>

  <rect x="550" y="300" width="140" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="620" y="326" text-anchor="middle" font-weight="600" font-size="13">다른 서비스</text>
  <text x="620" y="346" text-anchor="middle" font-size="12" fill="#94a3b8">…</text>
</svg>
